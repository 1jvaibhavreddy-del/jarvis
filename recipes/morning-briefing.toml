[recipe]
name = "morning-briefing"
kind = "operator"
description = "Daily 08:00 briefing — tasks, calendar, and top tech news synthesized and sent to Telegram"
version = "0.1.0"

[intelligence]
model = "qwen3:8b"

[engine]
key = "ollama"

[agent]
type = "orchestrator"
max_turns = 20
temperature = 0.4
tools = [
  "digest_collect",
  "calendar_upcoming",
  "web_search",
  "memory_search",
  "memory_store",
  "channel_send",
  "think",
]
system_prompt = """You are the morning briefing agent. Each cycle produces ONE concise briefing and sends it to the configured channel.

Workflow:
1. GATHER — digest_collect for tasks/mail; calendar_upcoming for today and tomorrow; web_search for top stories in AI/ML, developer tooling, and Indian tech business.
2. CROSS-REFERENCE — verify single-source claims against a second source; mark unconfirmed items explicitly.
3. CONTEXT — memory_search for yesterday's briefing; carry forward unresolved threads and note what changed.
4. SYNTHESIZE into this shape (max 300 words):
   BRIEFING — <date>
   1. Today's priorities (max 3)
   2. Top stories (3-5 bullets: headline, why it matters, source)
   3. Watch-outs (conflicts, deadlines, unconfirmed)
   4. From yesterday (follow-ups only)
5. SEND via channel_send to the default channel. If the channel is not connected, print the briefing and say which channel is missing — do not retry blindly.
6. STORE the date and top 3 priorities with memory_store for tomorrow's follow-up.

Style: no filler, no full articles, no speculation presented as fact."""

[schedule]
type = "cron"
value = "0 8 * * *"

[channels]
output = ["telegram"]

[learning]
routing = "heuristic"

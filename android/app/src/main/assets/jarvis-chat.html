<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; background: #111c33; border-bottom: 1px solid #1e293b;
    flex: 0 0 auto;
  }
  header .title { font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  header .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#f59e0b; margin-right:6px; vertical-align:middle; }
  header .dot.on { background:#22c55e; }
  #settingsBtn {
    background: #1e293b; color: #93c5fd; border: 1px solid #334155;
    border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  #messages {
    flex: 1 1 auto; overflow-y: auto; padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .msg { max-width: 85%; padding: 10px 13px; border-radius: 14px; line-height: 1.45; font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #2563eb; border-bottom-right-radius: 4px; }
  .msg.ai   { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 4px; }
  .msg.err  { align-self: center; background: #450a0a; color: #fca5a5; font-size: 12.5px; text-align:center; }
  .msg.sys  { align-self: center; background: transparent; color: #64748b; font-size: 12px; }
  footer { flex: 0 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #111c33; border-top: 1px solid #1e293b; }
  #inputRow { display: flex; gap: 8px; }
  #input {
    flex: 1; background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 20px; padding: 11px 16px; font-size: 15px; outline: none;
  }
  #send {
    background: #2563eb; color: #fff; border: none; border-radius: 20px;
    padding: 0 18px; font-size: 15px; cursor: pointer; min-width: 56px;
  }
  #send:disabled { opacity: .5; }
  #overlay {
    position: fixed; inset: 0; background: rgba(2,6,23,.88); z-index: 20;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #overlay.show { display: flex; }
  .card { background: #111c33; border: 1px solid #334155; border-radius: 14px; padding: 18px; width: 100%; max-width: 420px; }
  .card h2 { font-size: 16px; margin-bottom: 14px; }
  .card label { display:block; font-size: 12px; color:#94a3b8; margin: 12px 0 4px; }
  .card input, .card select {
    width: 100%; background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
    border-radius: 8px; padding: 10px; font-size: 14px; outline: none;
  }
  .card .btns { display:flex; gap:10px; margin-top: 18px; }
  .card button { flex:1; border-radius: 8px; padding: 11px; font-size: 14px; cursor:pointer; border:none; }
  #saveBtn { background:#2563eb; color:#fff; }
  #closeBtn { background:#1e293b; color:#93c5fd; border:1px solid #334155; }
</style>
</head>
<body>

<header>
  <div class="title"><span id="statusDot" class="dot"></span>Jarvis</div>
  <button id="settingsBtn">⚙ Settings</button>
</header>

<div id="messages"></div>

<footer>
  <div id="inputRow">
    <input id="input" type="text" placeholder="Ask Jarvis…" autocomplete="off" />
    <button id="send">Send</button>
  </div>
</footer>

<div id="overlay">
  <div class="card">
    <h2>Connection</h2>
    <label>Server address</label>
    <input id="host" type="text" placeholder="http://localhost:8000" />
    <label>Model</label>
    <input id="model" type="text" placeholder="qwen3:8b" />
    <p style="font-size:11px;color:#64748b;margin-top:8px;line-height:1.4">
      The agent (orchestrator / simple / react) is chosen when the server
      starts (<code>jarvis serve --agent</code>) and can't be changed here.
    </p>
    <div class="btns">
      <button id="closeBtn">Cancel</button>
      <button id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var DEFAULTS = { host: "http://localhost:8000", model: "qwen3:8b" };
  var cfg = loadCfg();

  var $messages = document.getElementById("messages");
  var $input = document.getElementById("input");
  var $send = document.getElementById("send");
  var $statusDot = document.getElementById("statusDot");
  var $overlay = document.getElementById("overlay");
  var $host = document.getElementById("host");
  var $model = document.getElementById("model");

  function loadCfg() {
    try {
      var raw = localStorage.getItem("jarvisCfg");
      if (raw) {
        var o = JSON.parse(raw);
        return {
          host: o.host || DEFAULTS.host,
          model: o.model || DEFAULTS.model
        };
      }
    } catch (e) {}
    return Object.assign({}, DEFAULTS);
  }
  function saveCfg() {
    try { localStorage.setItem("jarvisCfg", JSON.stringify(cfg)); } catch (e) {}
  }

  function addMsg(text, cls) {
    var div = document.createElement("div");
    div.className = "msg " + (cls || "ai");
    div.textContent = text;
    $messages.appendChild(div);
    $messages.scrollTop = $messages.scrollHeight;
    return div;
  }

  function setStatus(ok, label) {
    $statusDot.className = "dot" + (ok ? " on" : "");
    $statusDot.title = label || (ok ? "connected" : "checking");
  }

  // Check server health (GET /v1/models) and show status.
  function checkServer() {
    var url = cfg.host.replace(/\/+$/, "") + "/v1/models";
    fetch(url, { method: "GET" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function () { setStatus(true, "connected"); })
      .catch(function () { setStatus(false, "server not reachable"); });
  }

  function sendMessage() {
    var text = $input.value.trim();
    if (!text) return;
    $input.value = "";
    $send.disabled = true;

    addMsg(text, "user");
    var bubble = addMsg("…", "ai");

    var url = cfg.host.replace(/\/+$/, "") + "/v1/chat/completions";
    var body = {
      model: cfg.model,
      messages: [{ role: "user", content: text }]
    };

    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (r) {
        if (!r.ok) {
          return r.text().then(function (t) { throw new Error(r.status + " " + (t || "").slice(0, 120)); });
        }
        return r.json();
      })
      .then(function (data) {
        var out = data && data.choices && data.choices[0] && data.choices[0].message
          ? data.choices[0].message.content
          : JSON.stringify(data).slice(0, 200);
        bubble.textContent = out || "(empty response)";
        $messages.scrollTop = $messages.scrollHeight;
      })
      .catch(function (err) {
        bubble.className = "msg err";
        bubble.textContent = "⚠ " + err.message +
          "\n\nIs `jarvis serve` running? Set the server address in Settings.";
      })
      .finally(function () {
        $send.disabled = false;
        checkServer();
      });
  }

  // ---- UI wiring ----
  $send.addEventListener("click", sendMessage);
  $input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  document.getElementById("settingsBtn").addEventListener("click", function () {
    $host.value = cfg.host;
    $model.value = cfg.model;
    $overlay.classList.add("show");
  });
  document.getElementById("closeBtn").addEventListener("click", function () {
    $overlay.classList.remove("show");
  });
  document.getElementById("saveBtn").addEventListener("click", function () {
    cfg.host = $host.value.trim() || DEFAULTS.host;
    cfg.model = $model.value.trim() || DEFAULTS.model;
    saveCfg();
    $overlay.classList.remove("show");
    checkServer();
    addMsg("Settings saved — server: " + cfg.host + " · model: " + cfg.model, "sys");
  });

  // Welcome + first health check.
  addMsg("Jarvis online. Type below to chat. Use ⚙ Settings to point at your server.", "sys");
  checkServer();
})();
</script>
</body>
</html>

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jarvis.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero external dependencies — this is a WebView wrapper around the local
// Jarvis API server, so it builds without any Maven/AndroidX downloads beyond
// the SDK platform itself.
dependencies {
}
